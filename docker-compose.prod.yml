name: tea-app-prod

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml:
    build: ./tea-app-ml
    restart: unless-stopped

  api:
    build: ./tea-app-api
    restart: unless-stopped
    env_file: ./tea-app-api/.env.production
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "true"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tea_app_api_production
      CACHE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tea_app_api_production_cache
      QUEUE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tea_app_api_production_queue
      CABLE_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/tea_app_api_production_cable
    depends_on:
      - db
      - ml #added ml

  frontend:
    build:
      context: ./tea-app-frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
